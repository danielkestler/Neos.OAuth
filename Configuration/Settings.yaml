Neos:
  OAuth:
    # The absolute base URI of the authorization server, e.g. https://example.com. If not set, Neos.Flow.http.baseUri
    # or the primary domain of the default site is used. It is never taken from the request's Host header
    issuer: null

    keys:
      # The keys are generated on first use at these paths. Data/Persistent must be shared by all servers
      privateKeyPath: '%FLOW_PATH_DATA%Persistent/Neos.OAuth/private.key'
      publicKeyPath: '%FLOW_PATH_DATA%Persistent/Neos.OAuth/public.key'
      encryptionKeyPath: '%FLOW_PATH_DATA%Persistent/Neos.OAuth/encryption.key'
      # Alternatively the keys themselves, e.g. '%env:NEOS_OAUTH_PRIVATE_KEY%' for containers. They take precedence
      # over the files, all three have to be set
      privateKey: null
      publicKey: null
      encryptionKey: null

    # ISO 8601 durations
    ttl:
      accessToken: 'PT1H'
      refreshToken: 'P30D'
      authCode: 'PT10M'

    # The Flow authentication provider whose accounts tokens are issued for
    accountAuthenticationProviderName: 'Neos.Neos:Backend'

    # scope identifier => description, contributed by the packages that consume the tokens
    scopes: {}

    # Classes implementing Neos\OAuth\Domain\ScopeProvider, for scopes a package derives, e.g. from its privileges
    #  'Vendor.Package': 'Vendor\Package\Security\MyScopes'
    scopeProviders: {}

    # How the consent page groups the scopes: by prefix, the part before the first dot. An icon is a single-colored SVG,
    # it takes the color of the text
    #  'my':
    #    label: 'My things'
    #    icon: 'resource://Vendor.Package/Public/Icons/my.svg'
    #    position: 10
    scopeGroups: {}

    # The resources that accept the tokens, contributed by the packages that serve them. Each one gets a metadata
    # document (RFC 9728) at /.well-known/oauth-protected-resource/<path>. A client can bind a token to resources by
    # naming their URIs (<issuer>/<path>) in "resource" parameters (RFC 8707), the token is then only accepted by those
    #  'Vendor.Package':
    #    path: 'api'                 # the resource is <issuer>/<path>
    #    name: 'My API'
    #    scopes: ['my.scope']        # the scopes it accepts
    #    scopeProvider: 'Vendor\Package\Security\MyScopes'   # or those of a scope provider instead
    #    documentation: 'api/docs'   # optional, relative to the issuer
    #    requireAudience: true       # optional, only accepts tokens bound to this resource, e.g. for MCP servers
    protectedResources: {}

    # Public clients declared by packages, e.g. for their docs: no registration needed. "{issuer}" in redirect URIs is
    # replaced per environment. Confidential clients are registered with ./flow oauth:createclient
    #  'my-app':
    #    name: 'My app'
    #    redirectUris: ['{issuer}/my-app/callback']
    #    grantTypes: ['authorization_code', 'refresh_token']   # the default
    #    scopes: ['my.scope']                                  # defaults to all registered scopes
    #    firstParty: false                                     # true skips the consent page
    clients: {}

    # Dynamic client registration (RFC 7591) at /oauth/register, e.g. for MCP clients. Only public clients (PKCE, no
    # secret) can register, and they get no permissions of their own: every token acts as the user who approved it.
    # The endpoint is anonymous and unlimited, so it is disabled by default (the Development context enables it)
    dynamicClientRegistration:
      enabled: false

    # Client ID metadata documents (draft-ietf-oauth-client-id-metadata-document), preferred by MCP clients over
    # dynamic registration: the client_id is an https URL, and the JSON document at that URL describes the client. Like
    # registered ones, these clients are public and get no permissions of their own. The server fetches URLs anyone can
    # name, so it is disabled by default (the Development context enables it)
    clientIdMetadataDocuments:
      enabled: false
      # Documents on hosts that resolve to private, loopback or other non-public addresses are refused, to keep the
      # server from probing internal services. Only allow them for local development
      allowPrivateNetworks: false
      # seconds
      timeout: 5
      # bytes
      maximumSize: 65536
      # How long a document is used before it is fetched again, in seconds: its Cache-Control max-age within these
      # bounds, the minimum without one. Clients are looked up on every request with a token
      cacheLifetime:
        minimum: 300
        maximum: 86400
      # If an outdated document cannot be fetched for a temporary reason (network, timeout, server error), it is used
      # for this many more seconds, so an outage of the client's website doesn't lock out its users. A definite answer,
      # e.g. 404 or an invalid document, ends the client at once
      gracePeriod: 86400
      # How long a failed fetch is remembered, in seconds, and an outdated document is not fetched again
      failureCacheLifetime: 30

  Flow:
    mvc:
      routes:
        'Neos.OAuth':
          position: 'before Neos.Neos'

    security:
      authentication:
        providers:
          # Authenticates "Authorization: Bearer <access token>" requests. It has no request patterns of its own:
          # every package that accepts the tokens adds one for its URLs. Use the "Uri" pattern type: Flow requires
          # a match of every pattern type, so a pattern of another type would disable the token for all the others
          'Neos.OAuth:Bearer':
            label: 'OAuth 2 Bearer'
            provider: 'Neos\OAuth\Security\OAuthBearerProvider'
            token: 'Neos\OAuth\Security\OAuthBearerToken'
            requestPatterns: {}

          # The authorize endpoint issues codes for the logged in backend user
          'Neos.Neos:Backend':
            requestPatterns:
              'Neos.OAuth:Authorize':
                pattern: 'ControllerObjectName'
                patternOptions:
                  controllerObjectNamePattern: 'Neos\OAuth\Controller\AuthorizeController'
